name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks OSS
        run: |
          wget -qO- https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"browser_download_url": .*linux_x64.tar.gz"' \
            | cut -d '"' -f 4 \
            | xargs wget -qO /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --exit-code 1
